<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mangodisk.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPDiskTool</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #f5f8fc;
      }

      .startup-screen {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        background:
          radial-gradient(circle at 50% 32%, rgb(18 171 227 / 16%), transparent 30%),
          radial-gradient(circle at 68% 18%, rgb(15 118 170 / 9%), transparent 26%), #f5f8fc;
        user-select: none;
        -webkit-user-select: none;
      }

      .startup-content {
        display: grid;
        gap: 14px;
        justify-items: center;
        pointer-events: none;
        color: #10243f;
        font:
          650 18px/1.2 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        letter-spacing: -0.015em;
      }

      .startup-mark {
        display: grid;
        width: 92px;
        height: 92px;
        place-items: center;
        border: 1px solid rgb(15 109 163 / 18%);
        border-radius: 28px;
        background: rgb(255 255 255 / 74%);
        box-shadow: 0 18px 44px rgb(7 37 68 / 11%), inset 0 1px 0 rgb(255 255 255 / 82%);
        backdrop-filter: blur(12px);
      }

      .startup-mark img {
        width: 74px;
        height: 74px;
      }

      .startup-progress {
        position: relative;
        overflow: hidden;
        width: 78px;
        height: 3px;
        margin-top: 2px;
        border-radius: 999px;
        background: rgb(15 109 163 / 15%);
      }

      .startup-progress::after {
        position: absolute;
        inset-block: 0;
        left: -45%;
        width: 45%;
        border-radius: inherit;
        animation: startup-progress 1.15s ease-in-out infinite;
        background: linear-gradient(90deg, transparent, #1099cf 34%, #14d3ef 72%, transparent);
        content: '';
      }

      @media (prefers-color-scheme: dark) {
        body,
        .startup-screen {
          background: #0a1628;
        }

        .startup-screen {
          background:
            radial-gradient(circle at 50% 32%, rgb(18 171 227 / 22%), transparent 30%),
            radial-gradient(circle at 68% 18%, rgb(45 212 191 / 11%), transparent 24%), #0a1628;
        }

        .startup-mark {
          border-color: rgb(20 187 216 / 22%);
          background: rgb(11 30 53 / 78%);
          box-shadow:
            0 18px 44px rgb(0 0 0 / 30%),
            inset 0 1px 0 rgb(255 255 255 / 5%);
        }

        .startup-content {
          color: #d6e6f7;
        }

        .startup-progress {
          background: rgb(20 187 216 / 21%);
        }

        .startup-progress::after {
          background: linear-gradient(90deg, transparent, #14b8d4 34%, #5eead4 72%, transparent);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-progress::after {
          left: 25%;
          width: 50%;
          animation: none;
          opacity: 0.72;
        }
      }

      @keyframes startup-progress {
        50% {
          left: 50%;
        }

        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="startup-screen" data-tauri-drag-region role="status" aria-label="BPDiskTool is starting">
        <div class="startup-content">
          <span class="startup-mark"
            ><img src="/mangodisk.svg" width="74" height="74" fetchpriority="high" alt=""
          /></span>
          <strong>BPDiskTool</strong>
          <span class="startup-progress" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
